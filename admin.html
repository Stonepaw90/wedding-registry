<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registry Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=4" />
  <style>
    .admin { max-width: 900px; margin: 2rem auto; padding: 0 1.25rem; }
    .card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); padding:1.4rem; margin-bottom:1.2rem; box-shadow:var(--shadow); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; }
    .grid .full { grid-column:1/-1; }
    label { display:block; font-size:.85rem; margin-bottom:.8rem; }
    input,textarea,select { width:100%; margin-top:.3rem; padding:.55rem .7rem; border:1px solid var(--border); border-radius:8px; font:inherit; }
    .row { display:flex; gap:.6rem; flex-wrap:wrap; }
    table { width:100%; border-collapse:collapse; font-size:.85rem; }
    th,td { padding:.5rem; border-bottom:1px solid var(--border); text-align:left; }
    .danger { color: var(--danger); }
  </style>
</head>
<body>
  <header class="site-header"><div class="container header-inner"><a class="brand" href="index.html">E &amp; A</a><nav class="nav"><a href="index.html">Site</a></nav></div></header>
  <div class="admin">
    <h1>Registry Admin</h1>
    <p class="muted">You will be asked for the admin token. Use to add/remove gifts. (In demo mode, edits stay in this browser.)</p>

    <div class="card">
      <h3>Add a gift</h3>
      <div class="grid">
        <label>Name <input id="a-name" required /></label>
        <label>Price <input id="a-price" type="number" step="0.01" /></label>
        <label>Category <input id="a-cat" /></label>
        <label>Priority
          <select id="a-prio"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select>
        </label>
        <label>Store URL <input id="a-url" /></label>
        <label>Image URL <input id="a-img" /></label>
        <label>Quantity <input id="a-qty" type="number" value="1" min="1" /></label>
        <label class="full">Description <textarea id="a-desc" rows="2"></textarea></label>
      </div>
      <button class="btn btn-primary" id="a-add">Add gift</button>
      <p id="a-status" class="form-status"></p>
    </div>

    <div class="card">
      <h3>Current gifts</h3>
      <table><thead><tr><th>Name</th><th>Price</th><th>Status</th><th></th></tr></thead><tbody id="a-list"></tbody></table>
    </div>
  </div>
  <script src="config.js?v=4"></script>
  <script src="gifts-data.js?v=4"></script>
  <script src="admin.js?v=4"></script>
</body>
</html>
